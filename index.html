<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Resgate na Lauro Gomes - Semana da ETEC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #0d1117; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; color: #fff; }
    #game-container { position: relative; width: 800px; height: 450px; border: 4px solid #b3261e; box-shadow: 0 0 30px rgba(179, 38, 30, 0.7); background: #161b22; overflow: hidden; }
    canvas { display: block; image-rendering: pixelated; }
    .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(13, 17, 23, 0.9); z-index: 10; }
    h1 { font-size: 32px; color: #ffcc00; text-shadow: 3px 3px #b3261e; margin-bottom: 20px; text-align: center; }
    .btn-group { display: flex; gap: 15px; }
    .btn { background: #b3261e; color: #fff; border: 3px solid #ffcc00; padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer; font-family: inherit; box-shadow: 4px 4px #000; transition: transform 0.1s; }
    .btn:hover { background: #d90429; transform: scale(1.05); }
    .btn:active { transform: translate(2px, 2px); }
    #dialogue-box { position: absolute; bottom: 15px; left: 20px; right: 20px; height: 110px; background: rgba(0, 0, 0, 0.95); border: 3px solid #ffcc00; border-radius: 6px; display: none; padding: 12px 18px; z-index: 5; }
    #dialogue-box .name { color: #00ffcc; font-weight: bold; font-size: 16px; margin-bottom: 6px; }
    #dialogue-box .text { color: #fff; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="450"></canvas>
  <div id="menu-screen" class="screen-overlay">
    <h1>ETEC LAURO GOMES<br><span style="font-size: 18px; color: #fff;">Operação: Resgatar o LC</span></h1>
    <div class="btn-group">
      <button class="btn" id="start-btn">INICIAR JOGO</button>
      <button class="btn" id="shop-btn" style="background: #2b4c7e;">LOJINHA</button>
    </div>
    <p style="margin-top: 25px; font-size: 12px; color: #8b949e;">[W/ESPAÇO] Pular • [S] Deslizar • [J/K] Atirar • [B] Pular pro Boss</p>
  </div>
  <div id="dialogue-box">
    <div class="name" id="diag-name">NSA</div>
    <div class="text" id="diag-text">Carregando...</div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let gameState = 'MENU';
let score = 0;
let photosCollected = 0;
let gameSpeed = 5.5;
let frameDelta = 1;

// Teclado
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (gameState === 'RUNNER' || gameState === 'BOSS') {
    if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') player.jump();
    if (e.code === 'KeyS' || e.code === 'ArrowDown') player.slide();
    if (e.code === 'KeyJ' || e.code === 'KeyK') player.shoot();
  }
  if (e.code === 'KeyB' && gameState === 'RUNNER') startBossFight();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Carregando Imagens DIRETAMENTE (Sem funções que causam erro CORS)
const playerImg = new Image();
playerImg.src = 'player_2.png';
let playerLoaded = false;
playerImg.onload = () => { playerLoaded = true; };

const batImg = new Image();
batImg.src = 'bat.png';
let batLoaded = false;
batImg.onload = () => { batLoaded = true; };

const bossImg = new Image();
bossImg.src = 'boss.png';
let bossLoaded = false;
bossImg.onload = () => { bossLoaded = true; };

// Partículas e Listas
let smokeParticles = [];
function createSmoke(x, y) {
  smokeParticles.push({ x: x, y: y, size: Math.random() * 5 + 3, alpha: 0.9, vx: -Math.random() * 2 - 1, vy: -Math.random() * 0.4 });
}

let bullets = [];
let bossProjectiles = [];
let bats = [];
let bossLasers = [];

// ==========================================
// PROTAGONISTA
// ==========================================
const player = {
  x: 80, y: 265, w: 55, h: 110,
  vy: 0, gravity: 0.7, jumpPower: -14,
  isGrounded: true, isSliding: false, shootTimer: 0, tick: 0,
  animationState: 'idle', animationFrame: 0, animationTimer: 0,
  hp: 3, maxHp: 3, invincibleTimer: 0, ammo: 3, maxAmmo: 3, isReloading: false, reloadTimer: 0, reloadDuration: 75,

  idleCrop: [0, 0, 0.125, 0.25],
  runCrops: [[0, 0.25, 0.125, 0.25], [0.125, 0.25, 0.125, 0.25], [0.250, 0.25, 0.125, 0.25], [0.375, 0.25, 0.125, 0.25], [0.500, 0.25, 0.125, 0.25], [0.625, 0.25, 0.125, 0.25], [0.750, 0.25, 0.125, 0.25], [0.875, 0.25, 0.125, 0.25]],
  jumpCrop: [0.125, 0.50, 0.125, 0.25],
  slideCrop: [0.500, 0.50, 0.25, 0.25],   
  shootCrop: [0, 0.75, 0.125, 0.25],
  shootJumpCrop: [0.375, 0.75, 0.125, 0.25],
  shootCrops: [[0, 0.75, 0.125, 0.25], [0.125, 0.75, 0.125, 0.25], [0.25, 0.75, 0.125, 0.25]],
  shootJumpCrops: [[0.375, 0.75, 0.125, 0.25], [0.5, 0.75, 0.125, 0.25], [0.625, 0.75, 0.125, 0.25]],

  setAnimationState(state) {
    if (this.animationState === state) return;
    this.animationState = state;
    this.animationFrame = 0;
    this.animationTimer = 0;
  },

  updateAnimation() {
    let nextState = 'idle';
    if (this.isSliding) nextState = 'slide';
    else if (!this.isGrounded) nextState = this.shootTimer > 0 ? 'jumpShoot' : 'jump';
    else if (this.shootTimer > 0) nextState = 'shoot';
    else if (gameState === 'RUNNER' || (gameState === 'BOSS' && (keys['KeyA'] || keys['KeyD']))) nextState = 'run';

    this.setAnimationState(nextState);

    const frameDurations = { idle: 1, run: 5, jump: 1, jumpShoot: 4, shoot: 4, slide: 1 };
    const frameCount = {
      idle: 1,
      run: this.runCrops.length,
      jump: 1,
      jumpShoot: this.shootJumpCrops.length,
      shoot: this.shootCrops.length,
      slide: 1
    }[this.animationState];

    this.animationTimer += frameDelta;
    const frameDuration = frameDurations[this.animationState];
    if (frameCount > 1 && this.animationTimer >= frameDuration) {
      const steps = Math.floor(this.animationTimer / frameDuration);
      this.animationTimer -= steps * frameDuration;
      this.animationFrame = (this.animationFrame + steps) % frameCount;
    }
  },

  jump() {
    if (this.isGrounded && !this.isSliding) {
      this.vy = this.jumpPower; this.isGrounded = false;
      for (let i = 0; i < 7; i++) createSmoke(this.x + 10, this.y + this.h);
    }
  },
  slide() {
    if (this.isGrounded && !this.isSliding && (gameState === 'RUNNER' || gameState === 'BOSS')) {
      this.isSliding = true; this.h = 55; this.w = 90;
      createSmoke(this.x, this.y + this.h - 5);
      setTimeout(() => { this.isSliding = false; this.h = 110; this.w = 55; }, 650);
    }
  },
  shoot() {
    if (this.isReloading || this.ammo <= 0) return;
    bullets.push({ x: this.x + this.w, y: this.isSliding ? this.y + 25 : this.y + 45, vx: 16 });
    this.ammo--; this.shootTimer = 15;
    if (this.ammo <= 0) { this.isReloading = true; this.reloadTimer = this.reloadDuration; }
  },
  takeDamage() {
    if (this.invincibleTimer > 0) return;
    this.hp--; this.invincibleTimer = 60;
    if (this.hp <= 0) { alert("FIM DE JOGO! O NSA te encheu de faltas!"); location.reload(); }
  },
  update() {
    if (this.invincibleTimer > 0) this.invincibleTimer -= frameDelta;
    if (this.shootTimer > 0) this.shootTimer -= frameDelta;
    if (this.isReloading) {
      this.reloadTimer -= frameDelta;
      if (this.reloadTimer <= 0) { this.ammo = this.maxAmmo; this.isReloading = false; }
    }
    if (gameState === 'BOSS') {
      if (keys['KeyA'] || keys['ArrowLeft']) this.x = Math.max(20, this.x - 5);
      if (keys['KeyD'] || keys['ArrowRight']) this.x = Math.min(boss.x - 70, this.x + 5);
    }
    this.vy += this.gravity; this.y += this.vy;
    let floorY = 375 - this.h;
    if (this.y >= floorY) { this.y = floorY; this.vy = 0; this.isGrounded = true; }
    this.tick += frameDelta;
    this.updateAnimation();
    if (this.isGrounded && gameState === 'RUNNER' && !this.isSliding && this.animationState === 'run') {
      const previousTick = this.tick - frameDelta;
      if (Math.floor(this.tick / 5) !== Math.floor(previousTick / 5)) createSmoke(this.x + 5, this.y + this.h - 5);
    }
  },
  draw() {
    if (!playerLoaded) return;
    if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 6) % 2 === 0) return;

    let cropRatio = this.idleCrop;
    let drawX = this.x, drawY = this.y, drawW = this.w, drawH = this.h;

    if (this.isSliding) {
      cropRatio = this.slideCrop; drawW = 110; drawH = 110; drawX = this.x - 10; drawY = this.y - 55;
    } else if (this.animationState === 'jump') {
      cropRatio = this.jumpCrop;
    } else if (this.animationState === 'jumpShoot') {
      cropRatio = this.shootJumpCrops[this.animationFrame];
    } else if (this.animationState === 'shoot') {
      cropRatio = this.shootCrops[this.animationFrame];
    } else if (this.animationState === 'run') {
      cropRatio = this.runCrops[this.animationFrame];
    }
    const sx = cropRatio[0] * playerImg.naturalWidth;
    const sy = cropRatio[1] * playerImg.naturalHeight;
    const sw = cropRatio[2] * playerImg.naturalWidth;
    const sh = cropRatio[3] * playerImg.naturalHeight;
    ctx.drawImage(playerImg, sx, sy, sw, sh, drawX, drawY, drawW, drawH);
  }
};

// ==========================================
// BOSS NSA (Renderização corrigida para JPEG)
// ==========================================
const boss = {
  active: false, x: 550, y: 150, w: 200, h: 180, hp: 100, maxHp: 100,
  tick: 0, frame: 0, mode: 'idle', modeTimer: 0, animationTimer: 0, attackCooldown: 120,

  idleCrops: [[0, 0, 0.25, 0.33], [0.25, 0, 0.25, 0.33], [0.5, 0, 0.25, 0.33]],
  punchCrops: [[0, 0.33, 0.25, 0.33], [0.25, 0.33, 0.25, 0.33]],
  summonCrops: [[0, 0.66, 0.25, 0.33], [0.25, 0.66, 0.25, 0.33], [0.5, 0.66, 0.25, 0.33]],

  setMode(mode, duration = 0) {
    if (this.mode !== mode) {
      this.mode = mode;
      this.frame = 0;
      this.animationTimer = 0;
    }
    this.modeTimer = duration;
  },

  update() {
    this.tick += frameDelta;

    if (this.mode !== 'idle') {
      this.modeTimer -= frameDelta;
      if (this.modeTimer <= 0) this.setMode('idle');
    }

    let currentList = this.idleCrops;
    if (this.mode === 'punch') currentList = this.punchCrops;
    if (this.mode === 'summon') currentList = this.summonCrops;
    this.animationTimer += frameDelta;
    const frameDuration = this.mode === 'idle' ? 10 : 8;
    if (this.animationTimer >= frameDuration) {
      const steps = Math.floor(this.animationTimer / frameDuration);
      this.animationTimer -= steps * frameDuration;
      if (this.mode === 'idle') this.frame = (this.frame + steps) % currentList.length;
      else this.frame = Math.min(currentList.length - 1, this.frame + steps);
    }

    this.attackCooldown -= frameDelta;
    if (this.attackCooldown <= 0) {
      this.attackCooldown = 120 + Math.random() * 60;
      
      if (Math.random() > 0.5) {
        this.setMode('punch', 36);
        bossProjectiles.push({ x: this.x + 20, y: this.y + 80 + (Math.random() * 40 - 20), vx: -(6 + Math.random() * 3), text: 'F' });
      } else {
        this.setMode('summon', 48);
        let qtd = Math.random() > 0.4 ? 2 : 1;
        for (let i = 0; i < qtd; i++) {
          bats.push({
            x: this.x + 80, y: this.y + 40, targetX: 50 + Math.random() * 350, targetY: 30 + Math.random() * 120,
            w: 60, h: 45, hp: 2, state: 'flying', timer: 0, tick: 0
          });
        }
      }
    }
  },
  draw() {
    const floatY = this.y + Math.sin(this.tick * 0.06) * 10;
    
    if (bossLoaded) {
      let currentList = this.idleCrops;
      if (this.mode === 'punch') currentList = this.punchCrops;
      if (this.mode === 'summon') currentList = this.summonCrops;
      const cropRatio = currentList[this.frame % currentList.length];

      const sx = cropRatio[0] * bossImg.naturalWidth;
      const sy = cropRatio[1] * bossImg.naturalHeight;
      const sw = cropRatio[2] * bossImg.naturalWidth;
      const sh = cropRatio[3] * bossImg.naturalHeight;

      // TRUQUE MÁGICO: Remove o fundo preto do JPEG na hora de desenhar!
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(bossImg, sx, sy, sw, sh, this.x, floatY, this.w, this.h);
      ctx.restore();
    } else {
      // Fallback caso a imagem demore ou falhe
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(this.x, floatY, this.w, this.h);
    }

    // Barra de Vida
    ctx.fillStyle = "#222"; ctx.fillRect(this.x + 20, floatY - 20, 160, 12);
    ctx.fillStyle = "#ef4444"; ctx.fillRect(this.x + 22, floatY - 18, (156) * (this.hp / this.maxHp), 8);
    ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 2; ctx.strokeRect(this.x + 20, floatY - 20, 160, 12);
    ctx.fillStyle = "#fff"; ctx.font = "10px monospace"; ctx.fillText("NSA - SISTEMA", this.x + 25, floatY - 25);
  }
};

// ==========================================
// MORCEGOS E COMBATE (Cálculo Corrigido)
// ==========================================
function handleCombatProjectiles() {
  // 1. Morcegos
  for (let i = bats.length - 1; i >= 0; i--) {
    let bat = bats[i];
    bat.tick += frameDelta;

    if (bat.animationState !== bat.state) {
      bat.animationState = bat.state;
      bat.animationTimer = 0;
    }
    bat.animationTimer += frameDelta;
    const frameDuration = bat.state === 'charging' ? 6 : 7;
    const frameCount = bat.state === 'charging' ? 3 : 4;
    const frameX = Math.floor(bat.animationTimer / frameDuration) % frameCount;
    let frameY = 0; // Voando normal (Linha 1 da imagem)

    if (bat.state === 'flying') {
      let dx = bat.targetX - bat.x, dy = bat.targetY - bat.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 5) { bat.x += (dx / dist) * 4; bat.y += (dy / dist) * 4; }
      else { bat.state = 'charging'; bat.timer = 50; }
    } 
    else if (bat.state === 'charging') {
      bat.timer--;
      // Alterna entre Anel de Carregamento (Linha 3 = índice 2) e Olhos Vermelhos (Linha 4 = índice 3)
      frameY = (Math.floor(bat.animationTimer / (frameDuration * frameCount)) % 2 === 0) ? 2 : 3;
      
      if (bat.timer <= 0) {
        let angle = Math.atan2((player.y + player.h/2) - (bat.y + bat.h/2), (player.x + player.w/2) - (bat.x + bat.w/2));
        bossLasers.push({ x: bat.x + bat.w/2, y: bat.y + bat.h/2, vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10 });
        bat.state = 'cooldown'; bat.timer = 40;
      }
    } 
    else if (bat.state === 'cooldown') {
      bat.timer--; bat.y -= 4;
      if (bat.y < -50) bats.splice(i, 1);
    }

    if (batLoaded) {
      // As duas linhas de ataque possuem somente 3 quadros. Usar 4 aqui
      // recortava a área vazia da spritesheet e fazia o morcego piscar.
      let sx = frameX * (batImg.naturalWidth / 4);
      let sy = frameY * (batImg.naturalHeight / 4);
      let sw = batImg.naturalWidth / 4;
      let sh = batImg.naturalHeight / 4;
      ctx.drawImage(batImg, sx, sy, sw, sh, bat.x, bat.y, bat.w, bat.h);
    }
  }

  // 2. Lasers
  for (let i = bossLasers.length - 1; i >= 0; i--) {
    let laser = bossLasers[i]; laser.x += laser.vx; laser.y += laser.vy;
    ctx.fillStyle = "#ff0000"; ctx.beginPath(); ctx.arc(laser.x, laser.y, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ffff00"; ctx.beginPath(); ctx.arc(laser.x, laser.y, 4, 0, Math.PI*2); ctx.fill();
    if (laser.x > player.x && laser.x < player.x + player.w && laser.y > player.y && laser.y < player.y + player.h) {
      player.takeDamage(); bossLasers.splice(i, 1); continue;
    }
    if (laser.y > canvas.height || laser.x < 0) bossLasers.splice(i, 1);
  }

  // 3. Tiros do Player
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i]; b.x += b.vx;
    ctx.fillStyle = "#38bdf8"; ctx.fillRect(b.x, b.y, 14, 10);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(b.x + 2, b.y + 2, 5, 6);

    let hit = false;
    if (boss.active && b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
      boss.hp = Math.max(0, boss.hp - 4); score += 30; hit = true;
      if (boss.hp <= 0) { alert("VITÓRIA! NSA DERROTADO! Você resgatou o LC!"); location.reload(); }
    }
    if (!hit) {
      for (let j = bats.length - 1; j >= 0; j--) {
        let bat = bats[j];
        if (b.x > bat.x && b.x < bat.x + bat.w && b.y > bat.y && b.y < bat.y + bat.h) {
          bat.hp -= 1; hit = true;
          if (bat.hp <= 0) { bats.splice(j, 1); score += 20; }
          break;
        }
      }
    }
    if (hit || b.x > canvas.width) bullets.splice(i, 1);
  }

  // 4. Letras F do Boss
  for (let i = bossProjectiles.length - 1; i >= 0; i--) {
    let bp = bossProjectiles[i]; bp.x += bp.vx;
    ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(bp.x, bp.y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 14px monospace"; ctx.fillText(bp.text, bp.x - 5, bp.y + 5);
    if (bp.x > player.x && bp.x < player.x + player.w && bp.y > player.y && bp.y < player.y + player.h) {
      player.takeDamage(); bossProjectiles.splice(i, 1); continue;
    }
    if (bp.x < -30) bossProjectiles.splice(i, 1);
  }
}

// Parallax e Spawns
let bgFar = 0, groundX = 0;
function drawMuseumParallax() {
  ctx.fillStyle = "#1a1f33"; ctx.fillRect(0, 0, canvas.width, 360);
  bgFar = (bgFar - gameSpeed * 0.2) % 400;
  for (let i = 0; i < 3; i++) {
    let x = bgFar + i * 400;
    ctx.fillStyle = "#131624"; ctx.fillRect(x + 50, 40, 90, 220);
    ctx.beginPath(); ctx.arc(x + 95, 40, 45, Math.PI, 0); ctx.fill();
  }
  groundX = (groundX - gameSpeed) % 40;
  ctx.fillStyle = "#4a1c1d"; ctx.fillRect(0, 360, canvas.width, 90);
  ctx.strokeStyle = "#2b0f10"; ctx.lineWidth = 2;
  for (let x = groundX; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 360); ctx.lineTo(x, 450); ctx.stroke(); }
  ctx.fillStyle = "#d4af37"; ctx.fillRect(0, 360, canvas.width, 4);
}

let objects = []; let spawnTimer = 0;
function spawnObjects() {
  spawnTimer++;
  if (spawnTimer > 85) {
    spawnTimer = 0; const rand = Math.random();
    if (rand < 0.35) objects.push({ type: 'photo', x: 820, y: 180 + Math.random() * 80, w: 24, h: 28 });
    else if (rand < 0.6) objects.push({ type: 'tcc', x: 820, y: 340, w: 30, h: 35 });
    else if (rand < 0.8) objects.push({ type: 'wire', x: 820, y: 363, w: 36, h: 12, spark: 0 });
    else objects.push({ type: 'notice', x: 820, y: 250, w: 40, h: 40 }); 
  }
}
function updateAndDrawObjects() {
  for (let i = objects.length - 1; i >= 0; i--) {
    let obj = objects[i]; obj.x -= gameSpeed;
    if (obj.type === 'photo') {
      ctx.fillStyle = "#fff"; ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
      ctx.fillStyle = "#003049"; ctx.fillRect(obj.x + 3, obj.y + 3, obj.w - 6, obj.h - 9);
      if (player.x < obj.x + obj.w && player.x + player.w > obj.x && player.y < obj.y + obj.h && player.y + player.h > obj.y) {
        photosCollected++; score += 150; objects.splice(i, 1);
        if (photosCollected >= 5) startBossFight();
        continue;
      }
    } else if (obj.type === 'tcc') {
      ctx.fillStyle = "#b3261e"; ctx.fillRect(obj.x, obj.y + 15, obj.w, 20);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(obj.x + 3, obj.y, obj.w - 6, 15);
      ctx.fillStyle = "#000"; ctx.font = "8px monospace"; ctx.fillText("TCC", obj.x + 5, obj.y + 25);
      if (player.x + player.w - 15 > obj.x && player.x + 15 < obj.x + obj.w && player.y + player.h > obj.y + 4) { player.takeDamage(); objects.splice(i, 1); continue; }
    } else if (obj.type === 'wire') {
      ctx.fillStyle = "#111"; ctx.fillRect(obj.x, obj.y, obj.w, 8); obj.spark++;
      if (obj.spark % 6 < 3) { ctx.fillStyle = "#00ffff"; ctx.fillRect(obj.x + 12, obj.y - 6, 10, 10); }
      if (player.x + player.w - 10 > obj.x && player.x + 10 < obj.x + obj.w && player.y + player.h > obj.y - 2) { player.takeDamage(); objects.splice(i, 1); continue; }
    } else if (obj.type === 'notice') {
      ctx.fillStyle = "#ffb703"; ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
      ctx.fillStyle = "#d00000"; ctx.font = "8px monospace"; ctx.fillText("! DP !", obj.x + 6, obj.y + 20);
      if (player.x + player.w - 15 > obj.x && player.x + 15 < obj.x + obj.w && player.y < obj.y + obj.h && player.y + player.h > obj.y) { player.takeDamage(); objects.splice(i, 1); continue; }
    }
    if (obj.x < -60) objects.splice(i, 1);
  }
}
function handleSmoke() {
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    let p = smokeParticles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.035;
    ctx.fillStyle = `rgba(230, 230, 230, ${p.alpha})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    if (p.alpha <= 0) smokeParticles.splice(i, 1);
  }
}
function startBossFight() {
  boss.active = true; gameState = 'BOSS'; gameSpeed = 0; objects = [];
  document.getElementById('dialogue-box').style.display = 'block'; document.getElementById('diag-name').innerText = "BOSS: NSA";
  document.getElementById('diag-text').innerHTML = "ERRO 403: LC BLOQUEADO!<br>Desvie das Letras F e atire nos morcegos antes que eles disparem!";
  setTimeout(() => { document.getElementById('dialogue-box').style.display = 'none'; }, 3500);
}
function drawHUD() {
  ctx.fillStyle = "#fff"; ctx.font = "14px 'Courier New', monospace"; ctx.fillText("VIDA:", 20, 25);
  for (let i = 0; i < player.maxHp; i++) { ctx.fillStyle = i < player.hp ? "#e63946" : "#495057"; ctx.beginPath(); ctx.arc(75 + i * 22, 21, 8, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "#ffcc00"; ctx.fillText(`FOTOS: ${photosCollected}/5`, 20, 50); ctx.fillText(`PONTOS: ${score}`, 20, 72);
  if (gameState === 'BOSS') {
    ctx.fillStyle = "#00ffcc"; ctx.font = "13px monospace"; ctx.fillText("[A/D] Mover | [W] Pular | [S] Abaixar | [J/K] Atirar", 390, 25);
    if (player.isReloading) { ctx.fillStyle = "#ff3333"; ctx.font = "bold 13px monospace"; ctx.fillText("⚡ RECARREGANDO... ⚡", 470, 48); } 
    else { ctx.fillStyle = "#38bdf8"; ctx.fillText(`DISQUETES: `, 470, 48); for (let i = 0; i < player.ammo; i++) ctx.fillRect(570 + i * 16, 38, 11, 12); }
  }
}
let lastFrameTime = 0;
function gameLoop(timestamp = performance.now()) {
  frameDelta = lastFrameTime ? Math.min(2.5, (timestamp - lastFrameTime) / 16.6667) : 1;
  lastFrameTime = timestamp;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMuseumParallax(); handleSmoke();
  if (gameState === 'RUNNER') { spawnObjects(); updateAndDrawObjects(); player.update(); player.draw(); } 
  else if (gameState === 'BOSS') { handleCombatProjectiles(); player.update(); player.draw(); boss.update(); boss.draw(); }
  drawHUD(); requestAnimationFrame(gameLoop);
}

document.getElementById('start-btn').addEventListener('click', () => { document.getElementById('menu-screen').style.display = 'none'; gameState = 'RUNNER'; });
document.getElementById('shop-btn').addEventListener('click', () => { alert("Lojinha:\n- Coxinha da Lauro (Speed Boost)\n- Regra de Três (Escudo)"); });
gameLoop();
</script>
</body>
