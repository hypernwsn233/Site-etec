<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajude o LC! - Fliperama ETEC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #050508;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================================
       1. TELA DE LOBBY (FLIPERAMA INICIAL)
       ========================================= */
    #lobby-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #1a1a2e 0%, #050508 80%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    .arcade-wrapper {
      position: relative;
      max-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .arcade-wrapper:hover {
      transform: scale(1.03);
      filter: drop-shadow(0 0 35px rgba(255, 68, 68, 0.6));
    }

    .arcade-img {
      max-height: 75vh;
      max-width: 90vw;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    .insert-coin {
      margin-top: 24px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #ffcc00;
      text-shadow: 0 0 10px #ff3300, 2px 2px #000;
      animation: blink 0.9s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.2; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }

    /* =========================================
       2. TELA DO VÍDEO DE TRANSIÇÃO
       ========================================= */
    #video-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #skip-btn {
      position: absolute;
      top: 25px;
      right: 30px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 2px solid #ffcc00;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      z-index: 110;
      transition: 0.2s;
    }
    #skip-btn:hover {
      background: #ffcc00;
      color: #000;
    }

    /* =========================================
       3. TELA DO JOGO (TELA CHEIA)
       ========================================= */
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* O canvas ocupa toda a tela mantendo a proporção 16:9 pixelada */
    #gameCanvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      background: #111;
      box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
    }

    /* Scanlines sutis de fliperama antigo sobre o jogo */
    #game-container::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    #dialogue-box {
      position: absolute;
      bottom: 25px;
      left: 5vw;
      right: 5vw;
      background: rgba(0, 0, 0, 0.95);
      border: 3px solid #ffcc00;
      border-radius: 8px;
      padding: 15px 22px;
      display: none;
      z-index: 30;
    }
    #dialogue-box .name {
      color: #00ffcc;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }
    #dialogue-box .text {
      color: #fff;
      font-size: 16px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="lobby-screen">
    <div class="arcade-wrapper">
      <img src="arcade_lobby.jpg" alt="Fliperama ETEC - Ajude o LC" class="arcade-img">
    </div>
    <div class="insert-coin">► CLIQUE PARA INSERIR FICHA ◄</div>
  </div>

  <div id="video-screen">
    <button id="skip-btn">PULAR ▶▶</button>
    <video id="intro-video" src="intro.mp4" playsinline></video>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="dialogue-box">
      <div class="name" id="diag-name">NSA</div>
      <div class="text" id="diag-text">Carregando...</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
